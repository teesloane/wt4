{{define "project-detail"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} · weakty</title>
  {{template "styles" .}}
</head>
<body>
<div class="wrap">
  {{template "nav" .}}
  <article>
    <header>
      <h1>{{.Title}}</h1>
      <p class="meta">
        {{if .ProjectStatus}}<span class="type-label">{{.ProjectStatus}}</span>{{end}}
        {{.PublishedAt}}
      </p>
      {{if .Tags}}<div class="tags" style="margin-top:0.5rem">{{range .Tags}}<a class="tag" href="/areas/{{.Slug}}">{{.Name}}</a>{{end}}</div>{{end}}
    </header>
    {{if .Excerpt}}<p class="excerpt-block">{{.Excerpt}}</p>{{end}}
    <div class="body">{{.HTML}}</div>
    <div class="back-link"><a href="/projects">← projects</a></div>
  </article>
</div>
</body>
</html>
{{end}}
