{{define "link-detail"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} · weakty</title>
  {{template "styles" .}}
</head>
<body>
<div class="wrap">
  {{template "nav" .}}
  <article>
    <header>
      <h1>{{.Title}}</h1>
      <p class="meta">{{.PublishedAt}}</p>
      {{if .Tags}}<div class="tags" style="margin-top:0.5rem">{{range .Tags}}<a class="tag" href="/areas/{{.Slug}}">{{.Name}}</a>{{end}}</div>{{end}}
    </header>
    {{if .OGImage}}<img class="og-image" src="{{.OGImage}}" alt="">{{end}}
    <a class="external-link" href="{{.SiteURL}}" target="_blank" rel="noopener">{{.SiteURL}}</a>
    {{if .Commentary}}<div class="body">{{.Commentary}}</div>{{end}}
    <div class="back-link"><a href="/links">← links</a></div>
  </article>
</div>
</body>
</html>
{{end}}
