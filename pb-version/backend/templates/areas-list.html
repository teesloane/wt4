{{define "areas-list"}}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>areas · weakty</title>
  {{template "styles" .}}
</head>
<body class="bg-base-100 text-base-content">
<div class="max-w-2xl mx-auto px-6 py-16">
  {{template "nav" .}}
  <main>
    <p class="font-sans text-xs uppercase tracking-widest text-base-content/40 mb-10">areas of interest</p>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mt-4">
      {{range .Tags}}
      <a href="/areas/{{.Slug}}"
         class="p-4 border border-base-200 rounded-sm text-sm font-medium hover:border-base-content/30 hover:bg-base-200 transition-colors block">
        {{.Name}}
      </a>
      {{end}}
    </div>
  </main>
</div>
</body>
</html>
{{end}}
