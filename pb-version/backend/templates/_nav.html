  <div id="nav-links" class="flex flex-wrap justify-between items-center gap-x-5 gap-y-1 flex-1">
    <div class="hidden md:flex"> WEAKTY</div>
    <a href="/" class="{{link_class}}">home</a>
    <a href="/posts" class="{{link_class}}">writing</a>
    {* <a href="/til" class="{{link_class}}">til</a> *}
    {* <a href="/links" class="{{link_class}}">links</a> *}
    <a href="/reading" class="{{link_class}}">reading</a>
    <a href="/projects" class="{{link_class}}">projects</a>
    <a href="/now" class="{{link_class}}">now</a>
    <!-- <a href="/areas" class="{{link_class}}">areas</a> -->
    <a href="/archive" class="{{link_class}}">archive</a>
  </div>

    <div class="md:hidden"> WEAKTY</div>
  <button id="nav-hamburger" style="display:none"
    class="btn btn-ghost btn-circle opacity-40 hover:opacity-100"
    aria-label="Open menu">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6"  x2="19" y2="6"/>

<div id="mobile-nav-drawer"
  class="fixed top-0 right-0 bottom-0 w-64 z-50 bg-base-100 shadow-[-4px_0_24px_rgba(0,0,0,0.15)] flex flex-col p-8 translate-x-full transition-transform duration-250 ease-in-out">
  <button id="nav-close-btn"
    class="btn btn-ghost btn-circle opacity-40 hover:opacity-100 self-end mb-8"
    aria-label="Close menu">✕</button>
  <div id="drawer-links" class="flex flex-col gap-5 font-sans text-xs uppercase tracking-widest"></div>
</div>
<div id="mobile-nav-backdrop" class="hidden fixed inset-0 z-40 bg-black/30"></div>

<script>
(function() {
  var BREAKPOINT = 768;
  var links    = document.getElementById('nav-links');
  var hamburger = document.getElementById('nav-hamburger');
  var drawer    = document.getElementById('mobile-nav-drawer');
  var backdrop  = document.getElementById('mobile-nav-backdrop');
  var closeBtn  = document.getElementById('nav-close-btn');
  var drawerLinks = document.getElementById('drawer-links');

  // Populate drawer once by cloning desktop links
  Array.from(links.children).forEach(function(a) {
    var clone = a.cloneNode(true);
    clone.className = 'opacity-40 hover:opacity-100 transition-opacity';
    drawerLinks.appendChild(clone);
  });

  function applyLayout() {
    var mobile = window.innerWidth < BREAKPOINT;
    links.style.display     = mobile ? 'none' : '';
    hamburger.style.display = mobile ? '' : 'none';
    if (!mobile) closeDrawer();
  }

  function openDrawer()  { drawer.classList.remove('translate-x-full'); backdrop.classList.remove('hidden'); }
  function closeDrawer() { drawer.classList.add('translate-x-full');    backdrop.classList.add('hidden'); }

  hamburger.addEventListener('click', openDrawer);
  closeBtn.addEventListener('click', closeDrawer);
  backdrop.addEventListener('click', closeDrawer);

  applyLayout();
  window.addEventListener('resize', applyLayout);
})();
</script>
