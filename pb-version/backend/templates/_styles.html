{{define "styles"}}
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 1.1rem;
  line-height: 1.75;
  color: #1a1a1a;
  background: #fafaf8;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 2rem 1.5rem; }
nav {
  font-family: system-ui, sans-serif;
  font-size: 0.75rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 3rem;
  display: flex;
  gap: 1.25rem;
  flex-wrap: wrap;
}
nav a { color: #999; text-decoration: none; }
nav a:hover { color: #1a1a1a; }
h1 { font-size: 1.75rem; line-height: 1.2; margin-bottom: 0.5rem; }
h2 { font-size: 1.2rem; font-weight: normal; margin-bottom: 0.2rem; }
h2 a { text-decoration: none; color: #1a1a1a; }
h2 a:hover { text-decoration: underline; }
.page-label {
  font-family: system-ui, sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #aaa;
  margin-bottom: 2.5rem;
}
.meta { font-family: system-ui, sans-serif; font-size: 0.78rem; color: #999; }
.type-label {
  display: inline-block;
  font-family: system-ui, sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  background: #efefed;
  color: #888;
  padding: 0.1rem 0.4rem;
  border-radius: 2px;
  margin-right: 0.3rem;
  vertical-align: middle;
}
.item { margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid #e8e8e6; }
.item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.excerpt { color: #555; margin-top: 0.4rem; font-size: 1rem; }
.tags { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-top: 0.65rem; }
.tag {
  font-family: system-ui, sans-serif;
  font-size: 0.7rem;
  background: #f2f2f0;
  color: #777;
  padding: 0.15rem 0.45rem;
  border-radius: 2px;
  text-decoration: none;
}
.tag:hover { background: #e8e8e6; color: #444; }
/* Article body */
article header { margin-bottom: 2.5rem; }
article .excerpt-block {
  font-style: italic;
  color: #666;
  border-left: 3px solid #ddd;
  padding-left: 1rem;
  margin-bottom: 2rem;
}
article .body p { margin-bottom: 1.25rem; }
article .body h2, article .body h3, article .body h4 { margin: 2rem 0 0.75rem; }
article .body ul, article .body ol { padding-left: 1.5rem; margin-bottom: 1.25rem; }
article .body li { margin-bottom: 0.25rem; }
article .body blockquote {
  border-left: 3px solid #ddd;
  padding-left: 1rem;
  color: #666;
  margin: 1.5rem 0;
  font-style: italic;
}
article .body code {
  font-size: 0.875em;
  background: #f2f2f0;
  padding: 0.1em 0.3em;
  border-radius: 2px;
  font-family: 'Courier New', monospace;
}
article .body pre {
  background: #f2f2f0;
  padding: 1rem 1.25rem;
  overflow-x: auto;
  margin-bottom: 1.25rem;
  border-radius: 3px;
}
article .body pre code { background: none; padding: 0; font-size: 0.875rem; }
article .body img { max-width: 100%; height: auto; display: block; margin: 1.5rem 0; }
article .body a { color: #1a1a1a; text-decoration: underline; text-underline-offset: 2px; }
article .body a:hover { color: #555; }
article .attribution {
  font-family: system-ui, sans-serif;
  font-size: 0.85rem;
  color: #888;
  margin-top: 2rem;
  padding-top: 1rem;
  border-top: 1px solid #e8e8e6;
}
article .attribution a { color: #888; }
.back-link {
  font-family: system-ui, sans-serif;
  font-size: 0.85rem;
  margin-top: 3rem;
  padding-top: 1.25rem;
  border-top: 1px solid #e8e8e6;
}
.back-link a { color: #999; text-decoration: none; }
.back-link a:hover { color: #1a1a1a; }
.rating { color: #c8a84b; letter-spacing: 0.05em; }
.media-creator { font-style: italic; color: #666; margin-top: 0.2rem; }
.external-link {
  display: inline-block;
  font-family: system-ui, sans-serif;
  font-size: 0.9rem;
  color: #555;
  margin-bottom: 1.5rem;
  word-break: break-all;
}
.og-image { max-width: 100%; height: auto; border-radius: 3px; margin-bottom: 1.5rem; display: block; }
.areas-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1rem;
  margin-top: 1rem;
}
.area-card {
  padding: 1rem;
  border: 1px solid #e8e8e6;
  border-radius: 3px;
  text-decoration: none;
  color: #1a1a1a;
  display: block;
}
.area-card:hover { border-color: #ccc; background: #f8f8f6; }
.area-card h2 { font-size: 1rem; font-weight: normal; margin: 0; }
</style>
{{end}}
