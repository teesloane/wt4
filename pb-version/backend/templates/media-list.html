{{ extends "_layout.html" }}
{{ block title() }}{{.PageTitle}}{{ end }}
{{ block body() }}
<p class="font-sans text-xs uppercase tracking-widest text-base-content/40 mb-10">{{.PageTitle}}</p>
<div class="space-y-1">
{{ range _, item := .Items }}
<div class="flex items-center gap-4 py-2 border-b border-base-200 last:border-0 min-w-0">
  {{ if item.Thumbnail }}
  <img src="{{item.Thumbnail}}" alt="" class="w-10 h-14 object-cover rounded-sm shrink-0 opacity-80 mr-2">  {{ else }}
  <div class="w-10 h-14 bg-base-200 rounded-sm shrink-0 mr-8"></div>
  {{ end }}
  <div class="flex-1 min-w-0">
    <a href="{{item.URL}}" class="text-sm hover:underline transition-all block truncate">{{item.Title}}</a>
    {{ if item.Creator }}<p class="text-xs opacity-40 mt-0.5">{{item.Creator}}</p>{{ end }}
  </div>
  <time class="text-xs opacity-40 tabular-nums shrink-0">{{item.PublishedAt}}</time>
</div>
{{ end }}
</div>
{{ end }}
